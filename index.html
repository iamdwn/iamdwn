<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Chat with Bọ Chán, Dozun's corgi.">
  <title>Bọ Chán — Chat</title>
  <link rel="icon" href="./assets/chat/bo-chan-avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <noscript><style>.chat-loading { display: none; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#conversation">Skip to chat</a>
  <div class="page-shell">
    <a class="back-link" href="https://github.com/iamdwn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
      <span>Back to GitHub</span>
    </a>
    <main class="conversation" id="conversation" aria-labelledby="chat-title" tabindex="-1">
      <header class="chat-header">
        <div class="bot-identity">
          <img src="./assets/chat/bo-chan-avatar.jpg" alt="" width="40" height="40">
          <div>
            <h1 id="chat-title">Bọ Chán</h1>
            <p id="connection-status" role="status" data-state="loading"><span>AI chatbot</span><span class="status-dot" aria-hidden="true"></span><span id="status-text">Connecting…</span></p>
          </div>
        </div>
        <div class="chat-actions">
          <button class="new-chat" id="new-chat" type="button" title="Start a new conversation" hidden disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H5v14h14v-7M16 3l5 5-9 9H7v-5Z"/></svg>
            <span>New chat</span>
          </button>
        </div>
      </header>
      <div class="chat-body">
        <div id="bp-embedded-webchat"></div>
        <div class="chat-loading" id="chat-loading" role="status"><p>Connecting to Bọ…</p></div>
        <div class="chat-welcome" id="chat-welcome" hidden>
          <h2>Hey there.</h2>
          <p>Send a message to get started.</p>
        </div>
        <div class="connection-help" id="connection-help" role="status" hidden>
          <p>Couldn't connect to Bọ.</p>
          <button type="button" id="retry-chat">Try again</button>
          <a href="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/06/03/07/20260603073144-4HN5XLI5.json" target="_blank" rel="noopener noreferrer">Open standalone chat</a>
        </div>
        <noscript><p class="noscript-message">Enable JavaScript or <a href="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/06/03/07/20260603073144-4HN5XLI5.json">open the standalone chat</a>.</p></noscript>
      </div>
    </main>
  </div>
</body>
</html>
