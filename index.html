<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="description" content="Trò chuyện cùng Bọ Chán, chú cún của Dozun.">
  <title>Bọ Chán — Chat</title>
  <link rel="icon" href="./assets/chat/bo-chan-avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <noscript><style>.chat-loading { display: none; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#conversation">Đến cuộc trò chuyện</a>
  <div class="page-shell">
    <a class="back-link" href="https://github.com/iamdwn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
      <span>Về GitHub</span>
    </a>
    <main class="conversation" id="conversation" aria-labelledby="chat-title" tabindex="-1">
      <header class="chat-header">
        <div class="bot-identity">
          <img src="./assets/chat/bo-chan-avatar.jpg" alt="" width="40" height="40">
          <div>
            <h1 id="chat-title">Bọ Chán</h1>
            <p id="connection-status" role="status" data-state="loading"><span>Chatbot AI</span><span class="status-dot" aria-hidden="true"></span><span id="status-text">Đang kết nối…</span></p>
          </div>
        </div>
        <div class="chat-actions">
          <button class="new-chat" id="new-chat" type="button" title="Bắt đầu cuộc trò chuyện mới" hidden disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H5v14h14v-7M16 3l5 5-9 9H7v-5Z"/></svg>
            <span>Chat mới</span>
          </button>
        </div>
      </header>
      <div class="chat-body">
        <div id="bp-embedded-webchat"></div>
        <div class="chat-loading" id="chat-loading" role="status"><p>Đang kết nối với Bọ…</p></div>
        <div class="chat-welcome" id="chat-welcome" hidden>
          <h2>Chào bạn.</h2>
          <p>Nhắn Bọ một câu để bắt đầu.</p>
        </div>
        <div class="connection-help" id="connection-help" role="status" hidden>
          <p>Chưa kết nối được với Bọ.</p>
          <button type="button" id="retry-chat">Thử lại</button>
          <a href="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/06/03/07/20260603073144-4HN5XLI5.json" target="_blank" rel="noopener noreferrer">Mở khung chat riêng</a>
        </div>
        <noscript><p class="noscript-message">Bật JavaScript hoặc <a href="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/06/03/07/20260603073144-4HN5XLI5.json">mở khung chat của Bọ</a>.</p></noscript>
      </div>
    </main>
  </div>
</body>
</html>
