      .zvLock-planet-behind, .zvLock-planet-front, .zvLock-planet-glow, .zvLock-sheen { animation: none; }
      .zvLock-planet-behind { opacity: 0; }
      .zvLock-planet-front { opacity: 1; transform: translate(41.81px,16.07px); }
    }
