<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dozun — Back-end developer</title>
  <desc id="desc">Dozun and Zuni, his orange pixel fox.</desc>
  <defs><clipPath id="fox"><rect width="80" height="80"/></clipPath></defs>
  <style>
    .frames { image-rendering: pixelated; animation: idle 1.6s steps(8, end) infinite; }
    @keyframes idle { to { transform: translateX(-640px); } }
    @media (prefers-reduced-motion: reduce) { .frames { animation: none; } }
  </style>
  <rect width="640" height="270" fill="#0d1117"/>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="24" y="50" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#8b949e">@iamdwn</text>
    <text x="20" y="168" font-size="100" font-weight="650" letter-spacing="-6" fill="#f0f2f4">Dozun</text>
    <text x="24" y="210" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#b3b8bf">Back-end developer</text>
  </g>
  <path d="M24 240H620" stroke="#30363d"/>
  <path d="M24 240h52" stroke="#f47b39" stroke-width="3"/>
  <g transform="translate(358 6) scale(3)">
    <g clip-path="url(#fox)"><image class="frames" width="640" height="80" href="data:image/png;base64,"/></g>
  </g>
</svg>
