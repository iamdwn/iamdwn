    </linearGradient>
    <clipPath id="fc1"><rect x="22" y="45" width="0" height="19"><animate attributeName="width" from="0" to="82"  begin="0.3s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="fc2"><rect x="22" y="73" width="0" height="19"><animate attributeName="width" from="0" to="272" begin="0.75s" dur="0.9s" fill="freeze"/></rect></clipPath>
