    <clipPath id="fc4"><rect x="22" y="131" width="0" height="19"><animate attributeName="width" from="0" to="424" begin="2.45s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="fc5"><rect x="22" y="159" width="0" height="19"><animate attributeName="width" from="0" to="360" begin="3.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
