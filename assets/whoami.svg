    </rect>
  </g>
  <rect x="1" y="1" width="468" height="302" rx="11" stroke="url(#fedge)" stroke-width="1.5"/>

  <g font-size="13.5">
    <text x="22" y="59" clip-path="url(#fc1)"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e2e5ea">whoami</tspan></text>
    <text x="22" y="87" fill="#c4b5fd" clip-path="url(#fc2)">Dozun — 22 — Back-end Developer</text>

    <text x="22" y="117" clip-path="url(#fc3)"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e2e5ea">cat stack.txt</tspan></text>
    <text x="22" y="145" clip-path="url(#fc4)"><tspan fill="#6f7681">languages</tspan><tspan x="126" fill="#c4b5fd">C# · Java · TypeScript · JavaScript · C</tspan></text>
    <text x="22" y="173" clip-path="url(#fc5)"><tspan fill="#6f7681">databases</tspan><tspan x="126" fill="#c4b5fd">SQL Server · PostgreSQL · MySQL</tspan></text>
    <text x="22" y="201" clip-path="url(#fc6)"><tspan fill="#6f7681">devops</tspan><tspan x="126" fill="#c4b5fd">Docker · Git · Linux · GitHub Actions</tspan></text>

    <text x="22" y="231" clip-path="url(#fc7)"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e2e5ea">echo $MOTTO</tspan></text>
    <text x="22" y="259" fill="#fb923c" clip-path="url(#fc8)">"Less noise, more signal."</text>

    <text x="22" y="289" opacity="0"><tspan fill="#a78bfa">$ </tspan>
      <animate attributeName="opacity" values="0;1" begin="7.3s" dur="0.01s" fill="freeze"/>
    </text>
    <rect x="38" y="278" width="8.5" height="14" fill="#a78bfa" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="7.3s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="7.4s" repeatCount="indefinite"/>
    </rect>
