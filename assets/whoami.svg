  <g clip-path="url(#fwin)">
    <rect x="1" y="1" width="468" height="302" fill="#0d1117"/>
    <rect x="1" y="1" width="468" height="32" fill="#161b22"/>
    <circle cx="23" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="41" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="17" r="5" fill="#27c93f"/>
    <text x="235" y="21" text-anchor="middle" font-size="11.5" fill="#7d8590">dozun@github : ~ — zsh</text>
    <circle cx="404" cy="17" r="4" fill="#a78bfa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
