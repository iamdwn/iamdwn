name: Generate Snake Game

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Generate Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}  
          outputs: |
            dist/github-snake.svg?color_snake=#f97316&color_dots=#ede9fe,#c4b5fd,#a78bfa,#7c3aed,#5b21b6
            dist/github-snake-dark.svg?color_snake=#fb923c&color_dots=#161b22,#312e81,#4f46e5,#7c3aed,#a78bfa

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output  
          build_dir: dist 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

  
